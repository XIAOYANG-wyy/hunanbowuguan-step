<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#030507" />
    <meta name="description" content="用手势让三湘文物化为流光粒子。" />
    <title>三湘器物 · 流光</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose"></script>
  </head>
  <body>
    <main class="experience" id="experience">
      <div class="render-host" id="renderHost"></div>
      <div class="hud-card">
        <p class="hud-title">三湘器物 · 流光</p >
        <p class="hud-tip">将手掌放到画面内，吸引流光粒子</p >
      </div>
      <video id="cameraVideo" autoplay playsinline muted></video>
    </main>

<script type="module">
import * as THREE from 'three';

const host = document.getElementById('renderHost');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, host.clientWidth / host.clientHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(host.clientWidth, host.clientHeight);
host.appendChild(renderer.domElement);

const count = 1200;
const geo = new THREE.BufferGeometry();
const positions = new Float32Array(count * 3);
const originPos = new Float32Array(count * 3);
for(let i = 0; i < count; i++){
  const x = (Math.random()-0.5)*8;
  const y = (Math.random()-0.5)*8;
  const z = (Math.random()-0.5)*8;
  positions[i*3] = x;
  positions[i*3+1] = y;
  positions[i*3+2] = z;
  originPos[i*3] = x;
  originPos[i*3+1] = y;
  originPos[i*3+2] = z;
}
geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
const mat = new THREE.PointsMaterial({color:0xffdd88, size:0.08});
const points = new THREE.Points(geo, mat);
scene.add(points);
camera.position.z = 5;

let handModel = null;
let handX = 0, handY = 0;
const videoEl = document.getElementById('cameraVideo');

async function initHandPose(){
  handModel = await handpose.load();
  detectHand();
}
async function detectHand(){
  if(!handModel) return;
  const hands = await handModel.estimateHands(videoEl);
  if(hands.length > 0){
    const palm = hands[0].annotations.palmBase[0];
    handX = (palm[0] / videoEl.clientWidth - 0.5) * 8;
    handY = -(palm[1] / videoEl.clientHeight - 0.5) * 8;
  }
  setTimeout(detectHand,50);
}
navigator.mediaDevices.getUserMedia({video:true})
.then(stream=>{
  videoEl.srcObject = stream;
  initHandPose();
})
.catch(err=>console.log("摄像头开启失败",err));


const posAttr = geo.attributes.position;
function animate(){
  requestAnimationFrame(animate);

  for(let i=0;i<count;i++){
    const ix = i*3;
    const dx = handX - posAttr.array[ix];
    const dy = handY - posAttr.array[ix+1];
    const dist = Math.sqrt(dx*dx+dy*dy);
    if(dist < 2.5){
      posAttr.array[ix] += dx * 0.03;
      posAttr.array[ix+1] += dy * 0.03;
    }else{
      posAttr.array[ix] += (originPos[ix] - posAttr.array[ix]) * 0.02;
      posAttr.array[ix+1] += (originPos[ix+1] - posAttr.array[ix+1]) * 0.02;
    }
  }
  posAttr.needsUpdate = true;

  points.rotation.y += 0.001;
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', ()=>{
  camera.aspect = host.clientWidth / host.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(host.clientWidth, host.clientHeight);
})
</script>
  </body>
</html>
