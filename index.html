<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#030507" />
    <meta name="description" content="用手势让三湘文物化为流光粒子。" />
    <title>三湘器物 · 流光</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main class="experience" id="experience">
      <div class="render-host" id="renderHost"></div>
    </main>

<script type="module">
import * as THREE from 'three';

const host = document.getElementById('renderHost');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, host.clientWidth / host.clientHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(host.clientWidth, host.clientHeight);
host.appendChild(renderer.domElement);

// 生成静态粒子
const count = 1200;
const geo = new THREE.BufferGeometry();
const positions = new Float32Array(count * 3);
for(let i = 0; i < count; i++){
  positions[i*3] = (Math.random()-0.5)*8;
  positions[i*3+1] = (Math.random()-0.5)*8;
  positions[i*3+2] = (Math.random()-0.5)*8;
}
geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
const mat = new THREE.PointsMaterial({color:0xffdd88, size:0.08});
const points = new THREE.Points(geo, mat);
scene.add(points);

camera.position.z = 5;

function animate(){
  requestAnimationFrame(animate);
  points.rotation.y += 0.002;
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', ()=>{
  camera.aspect = host.clientWidth / host.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(host.clientWidth, host.clientHeight);
})
</script>
  </body>
</html>
