<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三湘器物·流光粒子</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            overflow: hidden;
            background: #000;
        }
    </style>
</head>
<body>
<script>
class Particle{
    constructor(){
        this.x = random(width);
        this.y = random(height);
        this.vx = random(-1,1);
        this.vy = random(-1,1);
        this.r = random(2,6);
    }
    update(){
        this.x += this.vx;
        this.y += this.vy;
        if(this.x<0 || this.x>width) this.vx *= -1;
        if(this.y<0 || this.y>height) this.vy *= -1;
    }
    display(){
        fill(255,220,100);
        noStroke();
        circle(this.x,this.y,this.r);
    }
}

let particles = [];
const num = 120;

function setup(){
    createCanvas(windowWidth,windowHeight);
    for(let i=0;i<num;i++){
        particles.push(new Particle())
    }
}
function draw(){
    background(0,15);
    particles.forEach(p=>{
        p.update();
        p.display();
    })
}
function windowResized(){
    resizeCanvas(windowWidth,windowHeight)
}
</script>
</body>
</html>
